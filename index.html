<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E3288">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Checklist Circuito SP - Ação Transportes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: app de vistoria para tablet — lista de vistorias → ficha em 4 etapas com barra fixa; alvos de toque ≥ 48px */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#14233A; --muted:#5B6676; --line:#D5DBE3;
  --accent:#EDB43C; --accent-ink:#1B1600; --navy:#1E3288; --navy-ink:#FFFFFF;
  --ok:#1E8A4C; --ok-soft:#DDF3E5; --bad:#C3362B; --bad-soft:#FBE3E0; --chip:#E4E8EE;
  --c1:#E2703F; --c2:#EDB43C; --c3:#8DC03F; --c4:#3E8FDA; --c5:#1E3288;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1622; --surface:#17212F; --ink:#E7ECF2; --muted:#9AA6B6; --line:#2A3748;
  --accent:#EDB43C; --accent-ink:#1B1600; --navy:#17266B; --navy-ink:#E7ECF2;
  --ok:#4CC27F; --ok-soft:#163525; --bad:#F06A5E; --bad-soft:#3A1C1A; --chip:#223044; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1622; --surface:#17212F; --ink:#E7ECF2; --muted:#9AA6B6; --line:#2A3748;
  --accent:#EDB43C; --accent-ink:#1B1600; --navy:#17266B; --navy-ink:#E7ECF2;
  --ok:#4CC27F; --ok-soft:#163525; --bad:#F06A5E; --bad-soft:#3A1C1A; --chip:#223044; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--navy-ink)}
header.bar .in{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.brand .stripe{width:8px;height:26px;border-radius:2px;background:linear-gradient(var(--c1) 0 25%,var(--c2) 25% 50%,var(--c3) 50% 75%,var(--c4) 75%)}
.bands{height:5px;background:linear-gradient(90deg,var(--c1) 0 25%,var(--c2) 25% 50%,var(--c3) 50% 75%,var(--c4) 75%)}
.hero{border-radius:14px;overflow:hidden;background:var(--c5);color:#fff}
.hero svg{display:block;width:100%;height:96px}
.hero-in{padding:2px 20px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.hero-in>div{flex:1 1 300px;min-width:0}
.hero .eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#fff;opacity:.85}
.hero h1{color:#fff;font-size:42px;margin-top:2px}
.hero p{margin:4px 0 0;color:#fff;opacity:.88;max-width:60ch}
.bar .sub{color:var(--navy-ink);opacity:.75;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.save{font-size:13px;opacity:.8;white-space:nowrap}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{min-height:48px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:inherit}
.btn.dark{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn:disabled{opacity:.45;cursor:not-allowed}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0}
h1{font-size:32px;text-transform:uppercase;letter-spacing:.01em}
h2{font-size:24px;text-transform:uppercase;letter-spacing:.02em}
h3{font-size:18px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.lead{color:var(--muted);margin:4px 0 0;max-width:65ch}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.notice{border-radius:8px;padding:12px 14px;background:var(--chip);font-size:15px}
.notice.bad{background:var(--bad-soft);color:var(--ink);border-left:4px solid var(--bad)}
/* list */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .t{font-weight:600;font-size:17px}
.card .m{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:999px;background:var(--chip);width:fit-content}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.cardopen{text-align:left;background:none;border:0;padding:0;display:flex;flex-direction:column;gap:6px;min-width:0;color:inherit}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.acts .btn,.row .btn.sm{min-height:44px;padding:0 12px;font-size:14px}
.danger{color:var(--bad)!important}
.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(10,17,27,.55);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--surface);color:var(--ink);border-radius:12px;padding:20px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:12px}
.modal .box p{margin:0;line-height:1.5}
.linkbox{margin-top:10px;font-size:13px;word-break:break-all;background:var(--bg);padding:10px;border-radius:8px;user-select:all}
.plate{font-family:var(--display);font-weight:700;letter-spacing:.08em;border:2px solid var(--ink);border-radius:4px;padding:0 6px;font-size:15px}
/* steps */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.step{min-height:56px;border:1px solid var(--line);background:var(--surface);border-radius:8px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:6px 10px;text-align:left;min-width:0}
.step b{font-family:var(--display);font-size:15px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.step small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.step[aria-current="true"]{border-color:var(--navy);box-shadow:inset 0 -4px 0 var(--accent)}
@media (max-width:640px){.steps{grid-template-columns:repeat(5,minmax(0,1fr))}.step small{display:none}.step b{font-size:13px}}
/* fields */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
label.f,div.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=number],select,textarea{font:inherit;font-weight:500;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;min-height:50px;padding:10px 12px;width:100%}
textarea{min-height:80px;resize:vertical}
.full{grid-column:1/-1}
/* inspection rows */
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1.4fr) auto minmax(0,1fr);gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .name{font-weight:600}
.item .name small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.item.flag .name{color:var(--bad)}
@media (max-width:720px){.item{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{min-height:48px;min-width:96px;border:0;background:var(--surface);font-weight:600;padding:0 14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"][data-v="ok"]{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"][data-v="avaria"]{background:var(--bad);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font-weight:600;display:inline-flex;align-items:center}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.ord{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);align-items:center;justify-content:center;font-size:13px;margin-right:8px}
.ent{display:flex;flex-direction:column;gap:8px;padding-block:10px;border-top:1px solid var(--line)}
.ent:first-of-type{border-top:0}
.obs{display:flex;flex-direction:column;gap:8px;min-width:0}
.was{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
/* checks */
.checks{display:flex;flex-direction:column;gap:2px}
.check{display:flex;gap:14px;align-items:center;min-height:56px;padding:6px 4px;border-top:1px solid var(--line);cursor:pointer}
.check:first-child{border-top:0}
.check input{width:30px;height:30px;accent-color:var(--ok);flex:none}
.check span{min-width:0}
/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--chip);max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{position:absolute;top:4px;right:4px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:18px}
.ph .n{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:2px 6px;border-radius:4px}
.addph{aspect-ratio:1;border:2px dashed var(--line);border-radius:8px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:600;color:var(--muted);max-width:100%}
.addph svg{width:30px;height:30px}
.occ{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.occ .hd{display:flex;align-items:center;gap:10px}
.occ .num{font-family:var(--display);font-size:22px;font-weight:700}
/* signatures */
.term{font-size:15px;max-width:70ch;background:var(--bg);border-left:4px solid var(--accent);padding:12px 14px;border-radius:0 8px 8px 0}
.sigs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.sig{display:flex;flex-direction:column;gap:8px;min-width:0}
.pad{width:100%;height:150px;background:#fff;border:1px solid var(--line);border-radius:8px;touch-action:none;display:block}
.sigimg{width:100%;height:150px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px}
.sig .when{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--navy-ink);padding:10px 16px;border-radius:8px;z-index:20;font-weight:600;max-width:calc(100% - 32px)}
.locked .chip,.locked .seg button,.locked input,.locked select,.locked textarea,.locked .addph,.locked .ph .x{pointer-events:none}
.locked .addph,.locked .ph .x,.locked [data-edit]{display:none!important}
@media (prefers-reduced-motion:no-preference){.btn,.seg button{transition:background .15s}}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
</style>
</head>
<body>

<header class="bar"><div class="in">
  <div class="brand"><span class="stripe" aria-hidden="true"></span>Vistoria / Evidências</div>
  <div class="sub" id="sub">Circuito SP · Ação Transportes</div>
  <div class="save" id="save"></div>
</div><div class="bands" aria-hidden="true"></div></header>

<main class="wrap" id="app"></main>
<nav class="nav" id="nav" hidden><div class="in" id="navin"></div></nav>
<div class="toast" id="toast" hidden></div>
<div class="modal" id="modal" hidden><div class="box" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt"></h2><p id="mx"></p><div class="row" id="mb" style="justify-content:flex-end"></div></div></div>
<input type="file" id="picker" accept="image/*" multiple hidden>

<script>
const ITEMS=[
 ["poltronas","Poltronas","Estofado sem rasgos, cortes ou manchas"],
 ["encostos","Encostos, apoios de braço e reclinadores",""],
 ["janelas","Janelas e vidros","Sem riscos, trincas ou pichação"],
 ["emergencia","Saídas de emergência","Lacres intactos"],
 ["teto","Teto, laterais e painéis","Sem riscos ou adesivos"],
 ["banheiro","Banheiro",""]
];
const OBS=["","Risco","Rasgo","Corte","Mancha","Sujeira","Chiclete","Pichação","Adesivo","Peça quebrada","Peça solta","Lacre rompido","Pré-existente (já registrado)","Outro"];
const CHECK_ANTES=[
 ["fotos","Fotos do interior feitas (corredor, frente, fundo, 1 por fileira) com data e hora"],
 ["acompanhou","Responsável da escola acompanhou a vistoria e confirmou as avarias pré-existentes"],
 ["lista","Lista nominal dos alunos entregue e conferida com o nº de embarcados"]
];
const CHECK_ORIENT=[
 ["sentado","Permanecer sentado e com cinto durante todo o trajeto"],
 ["riscar","Proibido riscar, rabiscar, colar adesivo ou subir nas poltronas"],
 ["emerg","Não abrir saídas de emergência nem mexer em martelinhos e extintor"],
 ["lixo","Lixo no saco entregue pela equipe, nada no chão ou nas poltronas"],
 ["danos","Avisado que danos serão apurados e comunicados à diretoria da escola"]
];
const CHECK_DEPOIS=[
 ["contados","Alunos desembarcados e contados (mesmo nº do embarque)"],
 ["permanece","Responsável da escola permanece até o fim da vistoria"],
 ["chegada","Vistoria de chegada acima preenchida, item por item, com o responsável"],
 ["piso","Poltronas e piso verificados à procura de chiclete, líquido, riscos e cortes"],
 ["lixo2","Lixo recolhido; objetos esquecidos registrados e entregues à escola"],
 ["lacres","Lacres das saídas de emergência conferidos"],
 ["fotogrupo","Foto do grupo tirada na frente do ônibus"],
 ["avaria","Avaria nova encontrada? Registrar na etapa 4 e fotografar de perto"],
 ["semavaria","Sem avarias: marcar \"Sem ocorrências\" na etapa 4 e colher assinaturas"]
];
const LOCAIS=["","Frente / motorista","Corredor","Banheiro","Fundo",...Array.from({length:15},(_,i)=>"Fileira "+(i+1)+" – lado motorista"),...Array.from({length:15},(_,i)=>"Fileira "+(i+1)+" – lado porta"),"Externo"];
const TERMO="Eu, responsável acima identificado, declaro que acompanhei as vistorias de saída e chegada do ônibus e que as informações registradas neste checklist são verdadeiras. Estou ciente de que a ocorrência será comunicada à Prefeitura de São Paulo e à direção da escola para apuração e ressarcimento, conforme as regras do Projeto Circuito São Paulo.";
const SIGNERS=[["escola","Responsável da escola"],["agente","Coordenador / supervisor da ação"],["motorista","Motorista"]];
const STEPS=[["ident","Identificação"],["antes","Antes"],["depois","Depois"],["ocorr","Ocorrências"],["assin","Assinaturas"]];

let db=null, assets=null, downloads=null, hashDone=false, list=[], cur=null, step="ident", saveTimer=null, photoTarget=null, ready=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtDate=s=>s?s.split("-").reverse().join("/"):"sem data";
const nowStr=()=>new Date().toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
function blank(){return{ident:{data:today(),escola:"",resp:"",cargo:"",doc:"",tel:"",alunos:"",adultos:"",prefixo:"",placa:"",motorista:"",agente:"",guia:"",embarque:"",retorno:"",roteiro:""},
 saida:{},obsSaida:{},chegada:{},obsChegada:{},checks:{},ocorrencia:"",ocorrencias:[],passeio:"",passeioOc:[],roteiroSel:[],roteiroOutro:"",entregaFotos:{},evidencias:[],obsSaidaTxt:{},obsChegadaTxt:{},
 sig:{},recusa:{ativa:false,motivo:"",testemunha:"",sig:null},status:"andamento",criado:Date.now(),atualizado:Date.now()}}

function status(v){
  const oc=v.ocorrencia==="com"||v.passeio==="com";
  if(v.status==="concluida") return oc?["bad","Concluída com ocorrência"]:["ok","Concluída"];
  return oc?["bad","Em andamento · ocorrência"]:["","Em andamento"];
}
function novas(v){return ITEMS.filter(([k])=>v.chegada[k]==="avaria"&&v.saida[k]!=="avaria").map(i=>i[1])}

/* ---------- list ---------- */
function renderList(){
  cur=null; $("#nav").hidden=true; $("#sub").textContent="Circuito SP · Ação Transportes"; $("#save").textContent="";
  const items=[...list].sort((a,b)=>(b.data.ident?.data||"").localeCompare(a.data.ident?.data||"")||(b.data.atualizado||0)-(a.data.atualizado||0));
  $("#app").innerHTML=`<div class="stack">
   <div class="hero"><svg viewBox="0 0 1000 170" preserveAspectRatio="none" aria-hidden="true"><polygon fill="#E2703F" points="0,0 1000,0 1000,30 500,70 0,30"/><polygon fill="#EDB43C" points="0,30 500,70 1000,30 1000,65 500,105 0,65"/><polygon fill="#8DC03F" points="0,65 500,105 1000,65 1000,100 500,140 0,100"/><polygon fill="#3E8FDA" points="0,100 500,140 1000,100 1000,125 500,165 0,125"/></svg>
   <div class="hero-in"><div><div class="eyebrow">Circuito SP · Ação Transportes</div><h1>Checklist / Evidências</h1><p>Uma ficha por ônibus e por passeio. Preencha com o responsável da escola antes do embarque e depois do desembarque. Os checklists ficam salvos neste tablet; envie o PDF pelo botão Compartilhar.</p></div>
   ${db&&assets?`<button class="btn primary" id="new">+ Novo checklist</button>`:""}</div></div>
   ${db&&!assets&&ready?`<div class="notice bad"><b>Seu acesso é só para visualizar.</b> Para criar e preencher checklists, peça ao responsável pela página para compartilhar com o seu e-mail com permissão de <b>Editor</b>. Depois recarregue a página.</div>`:""}
   ${!db&&ready?`<div class="notice bad"><b>Entre na sua conta Claude para usar as vistorias.</b> Toque em <b>Entrar</b> no topo da página. Se já entrou e esta mensagem continua, peça ao responsável para compartilhar a página com o seu e-mail, com permissão para editar.</div>`:""}
   ${!ready?`<div class="empty">Carregando vistorias…</div>`:!db?"":items.length?`<div class="cards">${items.map(({id,data:v})=>{const [c,l]=status(v);const i=v.ident||{};
     return `<div class="card"><button class="cardopen" data-open="${esc(id)}"><span class="pill ${c}">${l}</span><span class="t">${esc(i.escola||"Escola não informada")}</span>
     <span class="m">${fmtDate(i.data)}${i.embarque?" · "+esc(i.embarque):""}${i.placa?` · <span class="plate">${esc(i.placa)}</span>`:""}</span>
     <span class="m">${esc(i.resp||"Responsável não informado")}${i.alunos?" · "+esc(i.alunos)+" alunos":""}</span></button><div class="acts">${actBtns(id)}</div></div>`}).join("")}</div>`
   :`<div class="panel empty"><h2>Nenhum checklist ainda</h2><p>Toque em <b>Novo checklist</b> ao chegar na escola. A ficha salva sozinha a cada alteração.</p></div>`}
  </div>`;
  $("#new")?.addEventListener("click",()=>{const ref=db.collection("vistorias").doc();cur={id:ref.id,v:blank()};step="ident";persist(true);renderForm()});
  document.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>openRec(list.find(x=>x.id===b.dataset.open))));
  wireActs();
}

/* ---------- save ---------- */
function persist(now){
  if(!db||!cur) return; cur.v.atualizado=Date.now(); $("#save").textContent="Salvando…";
  clearTimeout(saveTimer);
  const go=async()=>{const snap={...cur.v},id=cur.id;try{await db.collection("vistorias").doc(id).set(JSON.parse(JSON.stringify(snap)));if(cur&&cur.id===id)$("#save").textContent="Salvo às "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
    catch(e){$("#save").textContent="Não salvou";toast(e?.code==="quota_exceeded"?"Armazenamento cheio. Avise o administrador.":"Não foi possível salvar. Verifique a internet; a ficha tenta de novo na próxima alteração.")}};
  now?go():saveTimer=setTimeout(go,700);
}

/* ---------- form ---------- */
function counts(){const v=cur.v;
  const identF=Object.values(v.ident).filter(Boolean).length, identT=Object.keys(v.ident).length;
  const antes=ITEMS.filter(([k])=>v.saida[k]).length+[...CHECK_ANTES,...CHECK_ORIENT].filter(([k])=>v.checks[k]).length, antesT=ITEMS.length+CHECK_ANTES.length+CHECK_ORIENT.length;
  const dep=ITEMS.filter(([k])=>v.chegada[k]).length+[...CHECK_DEPOIS,...ENTREGAS].filter(([k])=>v.checks[k]).length, depT=ITEMS.length+CHECK_DEPOIS.length+ENTREGAS.length;
  const sig=SIGNERS.filter(([k])=>v.sig[k]?.img).length;
  return{ident:identF+"/"+identT,antes:antes+"/"+antesT,depois:dep+"/"+depT,ocorr:(v.ocorrencia==="com"?v.ocorrencias.length:v.ocorrencia==="sem"?0:"—")+" ônibus · "+(v.passeio==="com"?v.passeioOc.length:v.passeio==="sem"?0:"—")+" passeio",assin:sig+"/3"}}

function renderForm(){
  const v=cur.v, locked=v.status==="concluida", c=counts();
  $("#sub").textContent=(v.ident.escola||"Nova vistoria")+(v.ident.placa?" · "+v.ident.placa:"");
  const body={ident:fIdent,antes:fAntes,depois:fDepois,ocorr:fOcorr,assin:fAssin}[step]();
  $("#app").innerHTML=`<div class="stack ${locked?"locked":""}">
   <div class="row"><button class="btn ghost" id="back">‹ Vistorias</button><span class="spacer"></span>${actBtns(cur.id,true)}
   ${locked?`<span class="pill ok">Concluída</span><button class="btn" id="reopen">Reabrir</button>`:""}</div>
   <div class="steps" role="tablist">${STEPS.map(([k,l],i)=>`<button class="step" role="tab" data-step="${k}" aria-current="${k===step}"><b>${i+1}. ${l}</b><small>${c[k]}</small></button>`).join("")}</div>
   ${!assets?`<div class="notice bad"><b>Seu acesso é só para visualizar.</b> As alterações, fotos e assinaturas não serão salvas. Peça ao responsável pela página para compartilhar com o seu e-mail com permissão de <b>Editor</b> e depois recarregue a página.</div>`:""}
   ${body}</div>`;
  const i=STEPS.findIndex(s=>s[0]===step);
  $("#nav").hidden=false;
  $("#navin").innerHTML=`<button class="btn" id="prev" ${i===0?"disabled":""}>‹ Voltar</button><span class="spacer"></span>
   ${i<STEPS.length-1?`<button class="btn dark" id="next">Próxima: ${STEPS[i+1][1]} ›</button>`:locked?"":`<button class="btn primary" id="finish">Concluir vistoria</button>`}`;
  wire();hydrate();
}

/* ---------- wiring ---------- */
function wire(){
  const v=cur.v;
  wireActs();
  $("#back").onclick=()=>{persist(true);renderList()};
  $("#reopen")&&($("#reopen").onclick=()=>{v.status="andamento";persist(true);renderForm()});
  document.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>go(b.dataset.step));
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  $("#prev").onclick=()=>{const i=STEPS.findIndex(s=>s[0]===step);if(i>0)go(STEPS[i-1][0])};
  $("#next")&&($("#next").onclick=()=>{const i=STEPS.findIndex(s=>s[0]===step);go(STEPS[i+1][0])});
  $("#finish")&&($("#finish").onclick=finish);
  document.querySelectorAll("[data-i]").forEach(el=>el.oninput=()=>{v.ident[el.dataset.i]=el.value;if(["escola","placa"].includes(el.dataset.i))$("#sub").textContent=(v.ident.escola||"Nova vistoria")+(v.ident.placa?" · "+v.ident.placa:"");persist()});
  document.querySelectorAll("[data-rot]").forEach(b=>b.onclick=()=>{const n=b.dataset.rot,s=v.roteiroSel||(v.roteiroSel=[]),i=s.indexOf(n);i>=0?s.splice(i,1):s.push(n);syncRot();persist();renderForm();if(n==="Outro"&&i<0)$("#rot_outro")?.focus()});
  $("#rot_outro")&&($("#rot_outro").oninput=e=>{v.roteiroOutro=e.target.value;syncRot();persist()});

   const stamp=nowStr();ctx.font=`600 ${Math.max(18,Math.round(c.width/45))}px system-ui,sans-serif`;const w=ctx.measureText(stamp).width;ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(c.width-w-24,c.height-ctx.measureText("M").width*2-12,w+24,ctx.measureText("M").width*2+12);
   ctx.fillStyle="#fff";ctx.textBaseline="bottom";ctx.fillText(stamp,c.width-w-12,c.height-8);
   URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error("conv")),"image/jpeg",.82)};

function setupPad(c){const r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;const ctx=c.getContext("2d");ctx.scale(dpr,dpr);
  ctx.lineWidth=2.4;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#14233A";let down=false;
  const p=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);const[x,y]=p(e);ctx.beginPath();ctx.moveTo(x,y)};
  c.onpointermove=e=>{if(!down)return;const[x,y]=p(e);ctx.lineTo(x,y);ctx.stroke();c._drawn=true};
  c.onpointerup=c.onpointercancel=()=>down=false}

  if(ITEMS.some(([k])=>!v.saida[k]))miss.push("vistoria de saída");if(ITEMS.some(([k])=>!v.chegada[k]))miss.push("vistoria de chegada");
  if(!v.ocorrencia)miss.push("Sem/Com ocorrências no ônibus");if(!v.passeio)miss.push("Sem/Com ocorrências no passeio");

    columnStyles:{0:{cellWidth:48,fontStyle:"bold"},1:{cellWidth:18,halign:"center"},3:{cellWidth:18,halign:"center"}},
    didParseCell:d=>{if(d.section!=="body")return;const k=ITEMS[d.row.index][0];if(v.chegada[k]==="avaria"&&v.saida[k]!=="avaria")d.cell.styles.fillColor=REDS;
      if(d.column.index===1||d.column.index===3){if(d.cell.raw==="Avaria"){d.cell.styles.textColor=RED;d.cell.styles.fontStyle="bold"}else if(d.cell.raw==="OK"){d.cell.styles.textColor=GREEN;d.cell.styles.fontStyle="bold"}}}});
  if(nb.length){y-=4;para("Linhas destacadas: avaria nova encontrada na vistoria de chegada.",7.8,GREY,"italic")}
  sub("Conferências");
  const grp=t=>[{content:t,colSpan:2,styles:{fillColor:SOFT,fontStyle:"bold",textColor:GREY}}];
  const ck=([k,l])=>[l,v.checks[k]?"Conferido":"Não conferido"];
  table({body:[grp("Antes do embarque"),...CHECK_ANTES.map(ck),grp("Orientação aos alunos (feita pelo guia)"),...CHECK_ORIENT.map(ck),grp("Depois do desembarque"),...CHECK_DEPOIS.map(ck)],
    columnStyles:{1:{cellWidth:30,halign:"center",fontStyle:"bold"}},
    didParseCell:d=>{if(d.section==="body"&&d.column.index===1)d.cell.styles.textColor=d.cell.raw==="Conferido"?GREEN:RED}});
  sub("Entregas aos alunos");
  table({head:[["Entrega","Status","Fotos"]],body:ENTREGAS.map(([k,l])=>[l,v.checks[k]?"Conferido":"Não conferido",String(((v.entregaFotos||{})[k]||[]).length)]),
    columnStyles:{1:{cellWidth:30,halign:"center",fontStyle:"bold"},2:{cellWidth:16,halign:"center"}},
    didParseCell:d=>{if(d.section==="body"&&d.column.index===1)d.cell.styles.textColor=d.cell.raw==="Conferido"?GREEN:RED}});
  for(const [k,l] of [...CHECK_ANTES,...CHECK_DEPOIS].filter(c=>PH.has(c[0])).concat(ENTREGAS)){const f=(v.entregaFotos||{})[k]||[];if(f.length){sub("Evidência: "+l);await grid(f)}}

  section(3,"Ocorrências no ônibus");
  if(v.ocorrencia!=="com")para(v.ocorrencia==="sem"?"Sem ocorrências no ônibus.":"Não informado.",9.5);
  else{table({head:[["Nº","Item","Local","Tipo de dano","Aluno(s) identificado(s)","Detalhe"]],
      body:v.ocorrencias.map((o,ix)=>[String(ix+1),val(outro(o.item,o.itemOutro)),val(o.local),val(outro(o.dano,o.danoOutro)),o.ident==="Sim"?"Sim"+(o.alunos?": "+o.alunos:""):val(o.ident),val(o.desc)]),
      columnStyles:{0:{cellWidth:9,halign:"center",fontStyle:"bold"}}});
    for(const [ix,o] of v.ocorrencias.entries())if(o.fotos&&o.fotos.length){sub("Fotos da ocorrência nº "+(ix+1));await grid(o.fotos)}}

  section(4,"Ocorrências durante o passeio");
  if(v.passeio!=="com")para(v.passeio==="sem"?"Sem ocorrências durante o passeio.":"Não informado.",9.5);
  else{table({head:[["Nº","Tipo","Horário","Aluno envolvido","Providência tomada","Detalhe"]],
      body:v.passeioOc.map((o,ix)=>["P"+(ix+1),val(outro(o.tipo,o.tipoOutro)),val(o.horario),o.aluno==="Sim"?"Sim"+(o.alunos?": "+o.alunos:""):val(o.aluno),val(outro(o.provid,o.providOutro)),val(o.desc)]),
      columnStyles:{0:{cellWidth:10,halign:"center",fontStyle:"bold"},2:{cellWidth:16,halign:"center"}}});
    for(const [ix,o] of v.passeioOc.entries())if(o.fotos&&o.fotos.length){sub("Fotos da ocorrência P"+(ix+1));await grid(o.fotos)}}

  section(5,"Evidências fotográficas");
  if(v.evidencias.length)await grid(v.evidencias);else para("Nenhuma foto de evidência anexada.",9.5);

  section(6,"Termo de responsabilidade");
  para(TERMO,9);
  const bw=(CW-8)/3,bh=40;ensure(bh+4);
  for(const [c,[k,role]] of SIGNERS.entries()){const s=v.sig[k],x=M+c*(bw+4);doc.setDrawColor(...LINE);doc.setLineWidth(.3);doc.rect(x,y,bw,bh);
    if(s&&s.img){const im=await imgData(s.img,800);if(im){const f=Math.min((bw-8)/im.w,20/im.h);doc.addImage(im.d,"JPEG",x+(bw-im.w*f)/2,y+2+(20-im.h*f)/2,im.w*f,im.h*f)}}
    else{doc.setFont("helvetica","italic");doc.setFontSize(8);doc.setTextColor(...GREY);doc.text("Não assinado",x+bw/2,y+13,{align:"center"})}
    doc.setDrawColor(...NAVY);doc.line(x+4,y+24,x+bw-4,y+24);
    ink();doc.setFont("helvetica","bold");doc.setFontSize(8.5);doc.text(doc.splitTextToSize((s&&s.nome)||"—",bw-8)[0],x+4,y+29);
    doc.setFont("helvetica","normal");doc.setFontSize(7.8);doc.setTextColor(...GREY);doc.text(role,x+4,y+33.5);if(s&&s.quando)doc.text("Assinado em "+s.quando,x+4,y+37.5)}
  y+=bh+7;
  if(v.recusa&&v.recusa.ativa){const r=v.recusa;sub("Recusa de assinatura");
    para("O responsável da escola recusou assinar. Motivo: "+val(outro(r.motivo,r.motivoOutro))+". Testemunha: "+val(r.testemunha)+(r.sig&&r.sig.quando?", assinado em "+r.sig.quando:"")+".",9);
    if(r.sig&&r.sig.img){ensure(28);const im=await imgData(r.sig.img,800);if(im){const f=Math.min(60/im.w,22/im.h);doc.addImage(im.d,"JPEG",M,y,im.w*f,im.h*f);y+=im.h*f+4}}}

  const n=doc.getNumberOfPages();
  for(let p=1;p<=n;p++){doc.setPage(p);stripe(H-2.5,2.5);if(p>1)stripe(0,2);doc.setDrawColor(...LINE);doc.setLineWidth(.2);doc.line(M,H-12,W-M,H-12);
    doc.setFont("helvetica","normal");doc.setFontSize(7.5);doc.setTextColor(...GREY);
    doc.text("Circuito SP · Ação Transportes · Relatório de vistoria "+code,M,H-7);doc.text("Página "+p+" de "+n,W-M,H-7,{align:"right"});
    if(p>1){doc.text("Relatório de Vistoria do Ônibus · "+(i.escola||"Escola não informada")+" · "+(i.data?fmtDate(i.data):""),M,12);doc.line(M,14.5,W-M,14.5)}}
  const name="Vistoria_"+(slug(i.escola)||"escola")+"_"+(i.data||"sem-data")+(i.placa?"_"+slug(i.placa):"")+".pdf";
  return {blob:doc.output("blob"),name}}

/* ---------- local storage (IndexedDB on this tablet) ---------- */
const IDB=new Promise((res,rej)=>{const r=indexedDB.open("checklist-circuito-sp",1);r.onupgradeneeded=()=>{r.result.createObjectStore("vistorias");r.result.createObjectStore("fotos")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=(store,mode,fn)=>IDB.then(d=>new Promise((res,rej)=>{const t=d.transaction(store,mode);const q=fn(t.objectStore(store));t.oncomplete=()=>res(q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}));
const idbPut=(st,v,k)=>tx(st,"readwrite",o=>o.put(v,k)),idbGet=(st,k)=>tx(st,"readonly",o=>o.get(k)),idbDel=(st,k)=>tx(st,"readwrite",o=>o.delete(k));
const idbAll=st=>IDB.then(d=>new Promise((res,rej)=>{const out=[];const q=d.transaction(st).objectStore(st).openCursor();q.onsuccess=()=>{const c=q.result;if(c){out.push({id:c.key,data:c.value});c.continue()}else res(out)};q.onerror=()=>rej(q.error)}));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const URLS=new Map();const bl=id=>URLS.get(id)||"";
async function getUrl(id){if(URLS.has(id))return URLS.get(id);const b=await idbGet("fotos",id);if(!b)return null;const u=URL.createObjectURL(b);URLS.set(id,u);return u}
function hydrate(){document.querySelectorAll("img[data-blob]").forEach(im=>{if(!im.getAttribute("src"))getUrl(im.dataset.blob).then(u=>{if(u)im.src=u})})}
db={collection:()=>({doc:id=>{id=id||uid();return{id,
  set:async d=>{await idbPut("vistorias",d,id);const i=list.findIndex(x=>x.id===id);if(i>=0)list[i]={id,data:d};else list.push({id,data:d})},
  delete:async()=>{await idbDel("vistorias",id);list=list.filter(x=>x.id!==id)}}}})};
assets={upload:async b=>{const id=uid();await idbPut("fotos",b,id);return{id}},
  delete:async id=>{await idbDel("fotos",id);const u=URLS.get(id);if(u){URL.revokeObjectURL(u);URLS.delete(id)}}};
downloads={save:async({filename,data})=>{const u=URL.createObjectURL(data);const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);return{status:"saved"}}};

/* ---------- boot ---------- */
renderList();
(async()=>{
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  try{list=await idbAll("vistorias")}catch(e){toast("Não foi possível abrir o armazenamento do tablet.")}
  ready=true;if(!cur)renderList();
})();
if("serviceWorker" in navigator)window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});setTimeout(()=>loadLibs().catch(()=>{}),4000)});
</script>
